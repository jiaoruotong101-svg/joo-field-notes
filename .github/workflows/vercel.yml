name: Deploy Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel-production
      url: https://joo-field-notes.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::Add VERCEL_DEPLOY_TOKEN to the vercel-production environment secrets; see DEPLOYMENT.md.'
            exit 1
          fi
      - run: npm ci
      - name: Verify interactive fixtures
        run: |
          npm run check:qc
          npm run check:resume
          npm run check:crawler
          npm run check:huahua
          npm run check:disclosure
          npm run check:caption
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@66.0.0
      - name: Verify target project access
        run: node scripts/check-vercel-access.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      - name: Pull production project configuration
        run: vercel pull --yes --environment=production --scope jdd12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      - name: Build production output
        run: vercel build --prod
      - name: Publish production output
        run: vercel deploy --prebuilt --prod --yes --scope jdd12 --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
